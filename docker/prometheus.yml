global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prime-mover-service
    static_configs:
      - targets: ['prime-mover-service:8080']

  - job_name: prime-mover-api
    static_configs:
      - targets: ['prime-mover-api:8082']

  - job_name: machine-service-0
    static_configs:
      - targets: ['machine-service-0:8080']

  - job_name: machine-service-1
    static_configs:
      - targets: ['machine-service-1:8080']

  - job_name: machine-service-2
    static_configs:
      - targets: ['machine-service-2:8080']

  - job_name: machine-service-3
    static_configs:
      - targets: ['machine-service-3:8080']

  - job_name: machine-api-0
    static_configs:
      - targets: ['machine-api-0:8081']

  - job_name: machine-api-1
    static_configs:
      - targets: ['machine-api-1:8081']

  - job_name: machine-api-2
    static_configs:
      - targets: ['machine-api-2:8081']

  - job_name: machine-api-3
    static_configs:
      - targets: ['machine-api-3:8081']
